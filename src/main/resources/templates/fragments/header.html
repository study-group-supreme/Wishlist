<div th:fragment="header">
    <nav>
        <div class="container">
            <a href="/" class="img-link">
                <img src="/images/greenwish-favicon.png" alt="Home">
            </a>

            <button type="button" onclick="window.location.href='/wishlist'"
                    th:if="${session.memberId} != null">
                My Wishlists!
            </button>

            <button type="button" onclick="window.location.href='/member/edit'"
                    th:if="${session.memberId} != null">
                Edit Account
            </button>
        </div>

        <!-- CENTER -->
        <div class="nav-center">
            <form class="searchbar" th:action="@{/wishlist/search}" method="get">
                <input type="search" name="username" placeholder="Search users...">
                <button type="submit">Go</button>
            </form>
        </div>

            <button type="button" onclick="window.location.href='/member/register'"
                    th:if="${session.memberId} == null">
                Register
            </button>

            <button type="button" onclick="window.location.href='/auth/login'"
                    th:if="${session.memberId} == null">
                Login
            </button>

            <button type="button" onclick="window.location.href='/auth/logout'"
                    th:if="${session.memberId != null}">
                Logout
            </button>

            <form th:if="${session.memberId != null}" th:action="@{/wishlist/search}" method="get">
                <input type="search" name="username" placeholder="Search for another's lists!">
                <button type="submit">Search</button>
            </form>


        </div>

    </nav>
</div>
