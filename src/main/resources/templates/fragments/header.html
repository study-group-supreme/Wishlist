<div th:fragment="header">
    <nav class="navbar">

        <!-- LEFT: Logo + Home -->
        <div class="nav-left">
            <a href="/" class="nav-left">
                <img src="/images/greenwish-favicon.png" alt="Home" style="height:32px;">
            </a>

            <button type="button"
                    onclick="window.location.href='/wishlist'"
                    th:if="${session.memberId != null}">
                My Wishlists
            </button>

            <button type="button"
                    th:if="${session.memberId != null}"
                    onclick="window.location.href='/wishlist/followed'">
                Lists You Follow
            </button>

            <button type="button"
                    onclick="window.location.href='/member/edit'"
                    th:if="${session.memberId != null}">
                Edit Account
            </button>
        </div>

        <!-- CENTER: Search bar -->
        <div class="nav-center">
            <form class="searchbar" th:if="${session.memberId != null}" th:action="@{/wishlist/search}" method="get">
                <input type="search" name="username" placeholder="Search users...">
                <button type="submit">Go</button>
            </form>
        </div>

        <!-- RIGHT: Auth buttons -->
        <div class="nav-right">
            <button type="button"
                    onclick="window.location.href='/member/register'"
                    th:if="${session.memberId == null}">
                Register
            </button>

            <button type="button"
                    onclick="window.location.href='/auth/login'"
                    th:if="${session.memberId == null}">
                Login
            </button>

            <button type="button"
                    onclick="window.location.href='/auth/logout'"
                    th:if="${session.memberId != null}">
                Logout
            </button>
        </div>

    </nav>
</div>
