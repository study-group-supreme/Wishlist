<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Item</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="content-box">
<h2>Edit Item</h2>

<form th:action="@{/wishlist/{wishlistId}/items/{itemId}/edit(
        wishlistId=${wishlistId},
        itemId=${item.id}
    )}"
      th:object="${item}"
      method="post">

  <p>
    <label>Name</label><br>
    <input type="text" th:field="*{name}" maxlength="100" required>
  </p>

  <p>
    <label>Description</label><br>
    <textarea th:field="*{description}" maxlength="255"></textarea>
  </p>

  <p>
    <label>URL (optional)</label><br>
    <input type="text" th:field="*{url}" maxlength="500">
  </p>

  <p>
    <label>Price</label><br>
    <input type="number" th:field="*{price}" min="0" max="99999999">
  </p>

  <p>
    <label>Note</label><br>
    <textarea th:field="*{note}" maxlength="255"></textarea>
  </p>

  <button type="submit">Save Changes</button>
</form>
<button th:onclick="'window.location.href=\'/wishlist/' + ${wishlistId} + '\''">
  Cancel
</button>
</div>
</body>
</html>
