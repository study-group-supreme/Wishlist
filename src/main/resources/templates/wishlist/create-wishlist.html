<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Wishlist</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<form th:action="@{/wishlist/save}" th:object="${wishlist}" method="post">

    <p>
        <label>Title</label><br>
        <input type="text" th:field="*{title}" placeholder="My Wishlist" autofocus maxlength="100" required>
    </p>

    <p>
        <label>Description</label><br>
        <textarea th:field="*{description}" placeholder="What this wishlist is about" maxlength="255"></textarea>
    </p>

    <p>
        <label>Public?</label>
        <input type="checkbox" th:field="*{public}">
    </p>

    <button type="submit">Save Wishlist</button>

</form>

<button onclick="window.location.href='/wishlist'">Cancel</button>

</body>
</html>
